<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A little apology</title>
  <meta name="description" content="A small, sincere apology.">
  <meta name="theme-color" content="#e6d6ee">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Decorative floating hearts (filled by script.js) -->
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" id="card" aria-labelledby="title">
      <p class="eyebrow">A little apology</p>
      <h1 class="title" id="title">I'm really sorry for my behavior...</h1>
      <p class="subtitle" id="subtitle">I know I may have hurt you, and I wish I could take that moment back.</p>

      <figure class="meme" role="img" aria-label="An illustrated crying kitten with big teary eyes. Caption: Me realizing I hurt you. Please don't stay mad at me.">
        <svg class="meme__art" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" focusable="false" aria-hidden="true">
          <defs>
            <linearGradient id="kBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f6e7f1"/>
              <stop offset="1" stop-color="#e4d0ea"/>
            </linearGradient>
            <radialGradient id="kFur" cx="50%" cy="38%" r="75%">
              <stop offset="0" stop-color="#ffc57a"/>
              <stop offset="1" stop-color="#ea8a2e"/>
            </radialGradient>
            <linearGradient id="kTear" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#bfe8ff" stop-opacity=".95"/>
              <stop offset="1" stop-color="#8fd0fb" stop-opacity=".7"/>
            </linearGradient>
          </defs>

          <rect width="300" height="300" fill="url(#kBg)"/>

          <!-- ears -->
          <g stroke-linejoin="round" stroke-linecap="round">
            <path d="M62 126 L52 60 L120 94 Z" fill="#f09a3a" stroke="#f09a3a" stroke-width="8"/>
            <path d="M238 126 L248 60 L180 94 Z" fill="#f09a3a" stroke="#f09a3a" stroke-width="8"/>
            <path d="M70 112 L64 80 L100 98 Z" fill="#f7a9b8" stroke="#f7a9b8" stroke-width="4"/>
            <path d="M230 112 L236 80 L200 98 Z" fill="#f7a9b8" stroke="#f7a9b8" stroke-width="4"/>
          </g>

          <!-- head -->
          <ellipse cx="150" cy="168" rx="98" ry="80" fill="url(#kFur)"/>
          <g stroke="#d4701a" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85">
            <path d="M150 92v22"/>
            <path d="M128 96l5 17"/>
            <path d="M172 96l-5 17"/>
          </g>
          <ellipse cx="150" cy="210" rx="43" ry="28" fill="#fff1dc"/>
          <ellipse cx="80" cy="196" rx="17" ry="10" fill="#ff8fa8" opacity=".45"/>
          <ellipse cx="220" cy="196" rx="17" ry="10" fill="#ff8fa8" opacity=".45"/>

          <!-- tears -->
          <g fill="none" stroke="url(#kTear)" stroke-width="10" stroke-linecap="round">
            <path d="M93 186 Q85 214 90 240"/>
            <path d="M207 186 Q215 214 210 240"/>
          </g>

          <!-- eyes -->
          <ellipse cx="108" cy="160" rx="27" ry="31" fill="#2a1710"/>
          <ellipse cx="192" cy="160" rx="27" ry="31" fill="#2a1710"/>
          <ellipse cx="108" cy="181" rx="24" ry="8" fill="#a6dcff" opacity=".6"/>
          <ellipse cx="192" cy="181" rx="24" ry="8" fill="#a6dcff" opacity=".6"/>
          <circle cx="99" cy="149" r="10" fill="#fff"/>
          <circle cx="183" cy="149" r="10" fill="#fff"/>
          <circle cx="119" cy="172" r="4.5" fill="#fff"/>
          <circle cx="203" cy="172" r="4.5" fill="#fff"/>

          <!-- sad brows -->
          <g stroke="#b35a12" stroke-width="6" stroke-linecap="round" fill="none">
            <path d="M80 140 Q104 134 128 122"/>
            <path d="M220 140 Q196 134 172 122"/>
          </g>

          <!-- nose + wobbly sad mouth -->
          <path d="M142 193 Q150 188 158 193 Q150 204 142 193Z" fill="#f27a96"/>
          <g stroke="#8a3d12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M150 202v10"/>
            <path d="M131 228 Q141 213 150 222 Q159 213 169 228"/>
          </g>

          <!-- whiskers -->
          <g stroke="#fff7ea" stroke-width="2" stroke-linecap="round" opacity=".9">
            <path d="M62 200 L20 192"/><path d="M62 211 L22 216"/>
            <path d="M238 200 L280 192"/><path d="M238 211 L278 216"/>
          </g>

          <!-- falling tear drops -->
          <ellipse class="drop drop--a" cx="88" cy="226" rx="5" ry="7" fill="#9fd8ff"/>
          <ellipse class="drop drop--b" cx="212" cy="226" rx="5" ry="7" fill="#9fd8ff"/>
        </svg>
        <span class="meme__cap meme__cap--top" aria-hidden="true">Me realizing I hurt you</span>
        <span class="meme__cap meme__cap--bottom" aria-hidden="true">Please don't stay mad at me</span>
      </figure>

      <div class="actions" id="actions">
        <button type="button" class="btn btn--yes" id="yesBtn">
          <svg class="icon-heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.8 1.2 5.6 3.3 1.8-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/>
          </svg>
          <span>Yes, I forgive you</span>
        </button>

        <div class="no-slot" id="noSlot">
          <button type="button" class="btn btn--no" id="noBtn">No</button>
        </div>
      </div>

      <p class="hint" id="hint" aria-live="polite"></p>
    </section>
  </main>

  <!-- Forgiveness modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText" tabindex="-1">
      <button type="button" class="modal__x" data-close aria-label="Close message">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="modal__emoji" aria-hidden="true">🥹</div>
      <h2 class="modal__title" id="modalTitle">I knew you'd forgive me... ❤️🥹</h2>
      <p class="modal__text" id="modalText">Thank you for giving me another chance. I promise I'll try to do better.</p>
      <p class="modal__secondary">You mean more to me than words can explain.</p>
      <p class="modal__sign" id="modalSign" hidden></p>
      <button type="button" class="btn btn--yes modal__close" data-close>Close</button>
      <div class="modal__hearts" id="modalHearts" aria-hidden="true"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
